# Typecheck, lint, unit tests and a production build. Needs no secrets:
# the site renders empty states without DATABASE_URL.
# Also weekly on main: code that reads the clock can break with no push at all, and the
# watchdog opens an issue when the last 3 scheduled runs of a workflow failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 2" # Tuesday 12:23 Ulaanbaatar

permissions:
  contents: read

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'schedule' || github.repository == 'tmorius-eng/UNENMEDEE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Every page of the demo build at phone widths (scripts/check-layout.ts): fails when one is
  # wider than the screen. Nov 2026: a one-line card header made /risk 644 px wide on phones and
  # only a reader's screenshot noticed. The demo data includes no high-risk stories, so the daily
  # watchdog scans the live site too.
  mobile-layout:
    if: github.event_name != 'schedule' || github.repository == 'tmorius-eng/UNENMEDEE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: pglite:./.demo-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/seed-demo.ts
      - run: npx next build
      - name: Scan every page at 320, 360 and 390 px
        run: |
          npx next start -p 3123 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3123/ && break; sleep 1; done
          npx tsx scripts/check-layout.ts --base http://localhost:3123 --sitemap

  # Blocks a PR that adds a dependency with a known high-severity advisory.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
