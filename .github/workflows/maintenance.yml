# Manual one-off repairs after a scraper or clustering change (nothing scheduled):
#   refetch-dates: fetch undated articles of the last 14 days again and re-date them
#                  (npm run db:repair-dates -- --refetch; robots.txt and 8 s per host apply)
#   recluster:     cluster the last 7 days' unclustered articles again (npm run ai:process -- --recluster)
#   ai-sample:     each free AI provider alone analyzes the built-in Mongolian sample (no database
#                  writes), so a new key or model can be judged on real output. "models" picks what
#                  to try, e.g. "mistral=mistral-small-latest openrouter=nvidia/nemotron-3-super-120b-a12b:free zai"
#                  (provider alone = its default model)
#   db-check:      connect like the site and the jobs (verified TLS) and print the server's
#                  certificate chain; run after a database or TLS change (no writes)
#   reanalyse:     run the AI analysis again for the article ids in "ids" (space separated), e.g.
#                  after the watchdog reports "undefined" in AI text (npm run ai:process -- --id <n>)
#   tenders-sync:  migrate, then read this year's tender results from Шилэн данс (12 report months,
#                  both groups) into /tenders without waiting for news-digest (npm run tenders:sync)
#   docs-watch:    migrate, then read audit.mn and the watched report/tender pages into /documents
#                  (npm run docs:watch)
name: Maintenance (manual)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "refetch-dates, recluster, ai-sample, db-check, reanalyse, tenders-sync or docs-watch"
        type: choice
        options: [refetch-dates, recluster, ai-sample, db-check, reanalyse, tenders-sync, docs-watch]
        default: recluster
      dry_run:
        description: "true = print what would change, write nothing (refetch-dates only)"
        type: boolean
        default: true
      ids:
        description: "reanalyse only: article ids, space separated (at most 20)"
        type: string
        default: ""
      models:
        description: "ai-sample only: provider or provider=model, space separated (empty = every free provider)"
        type: string
        default: ""

# Same rows as the pipeline: never at the same time (a queued run waits).
concurrency:
  group: maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.repository_owner == 'iltodmedee-mn'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run the task
        # Secrets only here: dependency install scripts never see them.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Migrations (db-check, tenders-sync, docs-watch) run over the session pooler like every other workflow.
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT || secrets.DATABASE_URL }}
          # ---- AI settings: keep identical to autonomous-news-pipeline.yml (tests/workflow-env.test.ts) ----
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # "true" only for a key from a Google project WITHOUT billing; otherwise Gemini is skipped.
          GEMINI_FREE_TIER: ${{ vars.GEMINI_FREE_TIER }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}
          AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}
          GROK_DAILY_MAX_CALLS: ${{ vars.GROK_DAILY_MAX_CALLS }}
          DEEPSEEK_DAILY_MAX_CALLS: ${{ vars.DEEPSEEK_DAILY_MAX_CALLS }}
          AI_TIER1_CHAIN: ${{ vars.AI_TIER1_CHAIN }}
          AI_TIER2_CHAIN: ${{ vars.AI_TIER2_CHAIN }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          GROK_MODEL: ${{ vars.GROK_MODEL || 'grok-4-fast' }}
          DEEPSEEK_PRICE_IN: ${{ vars.DEEPSEEK_PRICE_IN }}
          DEEPSEEK_PRICE_OUT: ${{ vars.DEEPSEEK_PRICE_OUT }}
          GROK_PRICE_IN: ${{ vars.GROK_PRICE_IN }}
          GROK_PRICE_OUT: ${{ vars.GROK_PRICE_OUT }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_DEEP_MODEL: ${{ vars.GEMINI_DEEP_MODEL }}
          REQUESTY_MODEL: ${{ vars.REQUESTY_MODEL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL }}
          IN_TASK: ${{ inputs.task }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_MODELS: ${{ inputs.models }}
          IN_IDS: ${{ inputs.ids }}
        run: |
          case "$IN_TASK" in
            refetch-dates)
              if [ "$IN_DRY" = "true" ]; then npm run db:repair-dates -- --refetch --dry-run; else npm run db:repair-dates -- --refetch; fi ;;
            recluster) npm run ai:process -- --recluster ;;
            ai-sample)
              # One provider at a time; a provider without a key says so and the next one runs.
              for spec in ${IN_MODELS:-groq nvidia requesty openrouter zai}; do
                if ! printf '%s' "$spec" | grep -Eq '^[a-z]+(=[A-Za-z0-9._:/-]+)?$'; then echo "::error::bad spec: $spec"; exit 1; fi
                p="${spec%%=*}"
                model_var="UNUSED_MODEL="
                if [ "$spec" != "$p" ]; then model_var="$(printf '%s' "$p" | tr a-z A-Z)_MODEL=${spec#*=}"; fi
                echo "::group::$spec"
                env AI_TIER1_CHAIN="$p" "$model_var" npm run ai:process -- --sample || echo "::warning::$spec failed"
                echo "::endgroup::"
              done ;;
            db-check)
              # Host and port only (no credentials): which certificate chain the server presents.
              target="$(node -e 'try{const u=new URL(process.env.DATABASE_URL);console.log(u.hostname+":"+(u.port||5432))}catch{}')"
              echo "::group::certificate chain of $target"
              timeout 20 openssl s_client -starttls postgres -connect "$target" -showcerts </dev/null 2>/dev/null | grep -E '^ *[0-9]+ s:|^ +i:|Verify return' || true
              echo "::endgroup::"
              npm run db:check
              DATABASE_URL="$DATABASE_URL_DIRECT" npm run db:migrate ;;
            reanalyse)
              # Digits only, at most 20 ids: the input reaches the shell through env, never inline.
              if ! printf '%s' "$IN_IDS" | grep -Eq '^ *[0-9]{1,9}( +[0-9]{1,9}){0,19} *$'; then echo "::error::ids must be 1-20 article ids separated by spaces"; exit 1; fi
              for id in $IN_IDS; do
                echo "::group::article $id"
                npm run ai:process -- --id "$id" || echo "::warning::article $id failed"
                echo "::endgroup::"
              done ;;
            tenders-sync)
              DATABASE_URL="$DATABASE_URL_DIRECT" npm run db:migrate
              npm run tenders:sync -- --months 12 ;;
            docs-watch)
              DATABASE_URL="$DATABASE_URL_DIRECT" npm run db:migrate
              NODE_EXTRA_CA_CERTS=certs/rapidssl-tls-rsa-ca-g1.pem npm run docs:watch ;;
            *) echo "::error::unknown task"; exit 1 ;;
          esac
          # Stored rows changed: refresh every page that shows them (article pages included).
          case "$IN_TASK" in
            reanalyse|recluster) npm run snapshots:write && npm run cache:purge -- --all ;;
            refetch-dates) if [ "$IN_DRY" != "true" ]; then npm run snapshots:write && npm run cache:purge -- --all; fi ;;
          esac
