# Claude Code on GitHub: write "@claude <what to do>" in an issue, a pull request comment or a
# review, and Claude reads CLAUDE.md, makes the change on a new branch, runs `npm run check` and
# opens a pull request (merging stays with a person: main is protected).
#
# Only people with write access can start it: the `if` below checks the comment author's role
# (OWNER / MEMBER / COLLABORATOR), and the action itself refuses anyone without write permission.
# Anyone can comment on a public repository, so never widen this (no `allowed_non_write_users`).
#
# Setup (docs/RUNBOOK.md §5): install the Claude GitHub App on this repository
# (https://github.com/apps/claude) and add ONE repository secret: CLAUDE_CODE_OAUTH_TOKEN
# (Claude Pro/Max: run `claude setup-token` on your computer) or ANTHROPIC_API_KEY (pay as you go).
# With neither set the job only prints a notice.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.repository == 'tmorius-eng/UNENMEDEE' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # Lets Claude read CI results on its pull requests.
      actions: read
    steps:
      - name: Check that a Claude credential is set
        id: cred
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" = "true" ] || [ "$HAS_KEY" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::@claude is not set up: add the CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repository secret (docs/RUNBOOK.md §5)."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cred.outputs.ok == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cred.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm

      # Dependencies before Claude starts, so `npm run check` works; no secret reaches the install scripts.
      - name: Install dependencies
        if: steps.cred.outputs.ok == 'true'
        run: npm ci

      - name: Run Claude Code
        if: steps.cred.outputs.ok == 'true'
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(npm run check),Bash(npm run typecheck),Bash(npm run lint),Bash(npm test),Bash(npm run test*),Bash(npx tsx --test *),Bash(git diff*),Bash(git status*),Bash(git log*)"
            --append-system-prompt "Read CLAUDE.md in full before changing anything and follow it. Answer the person in Mongolian. Keep the change as small as the problem; run npm run check and make it pass before you open a pull request; never skip, weaken or delete a test. Never print, commit or ask for a secret, token, password, DATABASE_URL or the VAPID private key."
