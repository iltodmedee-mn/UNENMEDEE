# Manual social posting: runs `npm run social:post` with the same secrets as the pipeline, so a
# new digest or important story can be sent to Facebook, Threads, Instagram, Telegram and Discord right away (or a
# setup checked) without waiting for the hourly pipeline. social_posts keeps it from posting
# anything twice, whichever run gets there first.
name: Social post (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "news = the most important new story, digest = the newest digest edition, quiz = the daily Discord quiz poll, weekly = last week's top list (any day), weekly-quiz = the weekly quiz carousel now, announce = the newest feature announcement (src/lib/social/announce.ts) on Facebook, Instagram and Threads"
        required: false
        default: "news"
      dry_run:
        description: "true = print the posts, publish nothing (default: post at once; social_posts still prevents doubles)"
        type: boolean
        default: false

concurrency:
  group: social-post
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    if: github.repository_owner == 'iltodmedee-mn'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Post to Facebook, Threads, Instagram, Telegram and Discord
        # Secrets only here: dependency install scripts never see them.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}
          IN_MODE: ${{ inputs.mode }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          case "$IN_MODE" in news|digest|quiz|weekly|weekly-quiz|announce) ;; *) echo "::error::mode must be news, digest, quiz, weekly, weekly-quiz or announce"; exit 1;; esac
          if [ "$IN_DRY" = "true" ]; then npm run social:post -- --mode "$IN_MODE" --dry-run; else npm run social:post -- --mode "$IN_MODE" --any-day; fi
