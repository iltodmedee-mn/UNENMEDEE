# Data syncs twice a day (opendata.mn, Mongolbank, budget, retention pruning) plus the AI news
# digest ("Онцлох тойм") when it is due. GitHub starts this schedule ~4.5 h late (12:30 and 01:00
# Ulaanbaatar), so the 12h edition is normally written by the hourly pipeline inside the
# morning/evening window (`npm run digest -- --due`); a manual run with force=true still writes
# one at once. It has its own concurrency group because GitHub cancels a pending run when
# another one queues in the same group.
name: News digest (12h)

on:
  schedule:
    - cron: "7 0,12 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "12h = regular edition, 30d = review of the last 30 days"
        required: false
        default: "12h"
      force:
        description: "Make a new edition even if one was made in the last hours (true/false)"
        required: false
        default: "false"

concurrency:
  group: news-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    # Forks keep the code but never run the scheduled jobs (no secrets, no Actions minutes).
    if: github.repository_owner == 'iltodmedee-mn'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # ---- AI settings: keep identical to autonomous-news-pipeline.yml (tests/workflow-env.test.ts) ----
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # "true" only for a key from a Google project WITHOUT billing; otherwise Gemini is skipped.
      GEMINI_FREE_TIER: ${{ vars.GEMINI_FREE_TIER }}
      REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}
      AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}
      GROK_DAILY_MAX_CALLS: ${{ vars.GROK_DAILY_MAX_CALLS }}
      DEEPSEEK_DAILY_MAX_CALLS: ${{ vars.DEEPSEEK_DAILY_MAX_CALLS }}
      AI_TIER1_CHAIN: ${{ vars.AI_TIER1_CHAIN }}
      AI_TIER2_CHAIN: ${{ vars.AI_TIER2_CHAIN }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      GROK_MODEL: ${{ vars.GROK_MODEL || 'grok-4-fast' }}
      DEEPSEEK_PRICE_IN: ${{ vars.DEEPSEEK_PRICE_IN }}
      DEEPSEEK_PRICE_OUT: ${{ vars.DEEPSEEK_PRICE_OUT }}
      GROK_PRICE_IN: ${{ vars.GROK_PRICE_IN }}
      GROK_PRICE_OUT: ${{ vars.GROK_PRICE_OUT }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_DEEP_MODEL: ${{ vars.GEMINI_DEEP_MODEL }}
      REQUESTY_MODEL: ${{ vars.REQUESTY_MODEL }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      ZAI_MODEL: ${{ vars.ZAI_MODEL }}
      # Facebook page, Threads and Instagram posting (docs/FACEBOOK.md); all unset = the steps are skipped.
      FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
      FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || secrets.DISCORD_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # Dependency install scripts never see a secret (a compromised package could send them out).
        env:
          DATABASE_URL: ""
          GROQ_API_KEY: ""
          GEMINI_API_KEY: ""
          REQUESTY_API_KEY: ""
          NVIDIA_API_KEY: ""
          MISTRAL_API_KEY: ""
          OPENROUTER_API_KEY: ""
          ZAI_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          FB_PAGE_TOKEN: ""
          THREADS_TOKEN: ""
          INSTAGRAM_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          DISCORD_BOT_TOKEN: ""
          DISCORD_CHANNEL_ID: ""
        run: npm ci || (sleep 60 && npm ci)

      - name: Check required secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret (Settings → Secrets → Actions)."; exit 1; fi

      - name: Apply database migrations
        id: migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT || secrets.DATABASE_URL }}
        run: npm run db:migrate

      # Keeps the free 500 MB database from filling (src/lib/retention.ts): cuts old bodies, deletes
      # old unpublished rows (URLs kept in seen_urls), tightens itself past 350 / 420 MB. The watchdog
      # reports it when prune_state stops moving, so a failure here is not silent.
      - name: Prune the database
        id: prune
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        env:
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
        run: npm run db:prune

      - name: Sync opendata.mn datasets
        id: opendata
        # Data problems must never block the news digest.
        continue-on-error: true
        run: npm run data:sync

      - name: Sync Mongolbank indicators (policy rate, inflation, FX, gold, reserves)
        id: macro
        continue-on-error: true
        run: npm run macro:sync

      - name: Sync budget data (NSO, Шилэн данс, World Bank, audit.mn)
        id: budget
        continue-on-error: true
        env:
          # audit.mn does not send its RapidSSL intermediate; trust DigiCert's public one (verification stays on).
          NODE_EXTRA_CA_CERTS: certs/rapidssl-tls-rsa-ca-g1.pem
        run: npm run budget:sync

      - name: Sync tender results (Шилэн данс form 1831, for /tenders)
        id: tenders
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        run: npm run tenders:sync

      - name: Watch report and tender pages (audit.mn, WordPress ministries, for /documents)
        id: documents
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        env:
          # audit.mn does not send its RapidSSL intermediate (see the budget step).
          NODE_EXTRA_CA_CERTS: certs/rapidssl-tls-rsa-ca-g1.pem
        run: npm run docs:watch

      - name: Sync open petitions to parliament (petition.parliament.mn, for /participate)
        id: petitions
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        run: npm run petitions:sync

      - name: Write the digest
        id: digest
        # A failed sync above never stops the digest; a failed digest never stops the steps below
        # (the pipeline may have written the edition already), but nothing runs on an old schema.
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        env:
          IN_KIND: ${{ inputs.kind || '12h' }}
          IN_FORCE: ${{ inputs.force || 'false' }}
        run: |
          case "$IN_KIND" in 30d) ;; *) IN_KIND=12h ;; esac
          if [ "$IN_FORCE" = "true" ]; then
            npm run digest -- --kind "$IN_KIND" --force
          else
            npm run digest -- --kind "$IN_KIND" --due
          fi

      # The home and topic pages show the newest edition from their snapshot
      # (docs/adr/0001-list-pages-read-snapshots.md): rewrite it and purge the digest pages.
      - name: Refresh the list-page snapshots
        id: snapshots
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        run: npm run snapshots:write -- --also digests

      - name: Notify subscribers about the new digest
        id: push_digest
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        continue-on-error: true
        run: npm run push:send -- --mode digest

      - name: Post the new digest to Facebook, Threads, Instagram, Telegram and Discord
        id: social_digest
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && (env.FB_PAGE_TOKEN != '' || env.THREADS_TOKEN != '' || env.INSTAGRAM_TOKEN != '' || env.TELEGRAM_BOT_TOKEN != '' || env.DISCORD_BOT_TOKEN != '') }}
        continue-on-error: true
        run: npm run social:post -- --mode digest

      - name: Daily Discord quiz poll (once a day)
        id: quiz
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && env.DISCORD_BOT_TOKEN != '' }}
        continue-on-error: true
        run: npm run social:post -- --mode quiz

      - name: Weekly top list on Mondays (once a week)
        id: weekly
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && (env.FB_PAGE_TOKEN != '' || env.THREADS_TOKEN != '' || env.TELEGRAM_BOT_TOKEN != '' || env.DISCORD_BOT_TOKEN != '') }}
        continue-on-error: true
        run: npm run social:post -- --mode weekly

      # Every step above keeps running after a failure (a scrape or AI outage must never stop the
      # digest or the pushes), so the run turned green whatever broke and the watchdog, which reads
      # only the run's conclusion, never saw it. A failed step is a failed run: the steps still ran.
      # The Chromium install is a convenience (the scrape falls back to --no-browser) and is left out.
      - name: Fail the run when a step failed
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          failed=$(printf '%s' "$STEPS" | jq -r 'to_entries[] | select(.key != "chromium" and .value.outcome == "failure") | .key')
          if [ -n "$failed" ]; then
            for s in $failed; do echo "::error::step '$s' failed: open its log above and paste it with the run URL into the bug report"; done
            exit 1
          fi
          echo "✓ every step succeeded"
